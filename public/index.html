<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balanza | Formulación</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">PLANTA · TRAZABILIDAD</p><h1>Balanza de formulación</h1><p id="device-status" class="device-status offline">Balanza: buscando dispositivo…</p></div><nav class="top-nav"><a class="secondary" href="/formulas.html">Configurar fórmulas</a><a class="secondary" href="/api/export.csv">Exportar registros</a></nav></header>
    <section class="card" id="start-card">
      <h2>Comenzar formulación</h2>
      <label for="operator">Operador</label><input id="operator" placeholder="Nombre del operador">
      <label for="polyol">Poliol cargado (kg)</label><input id="polyol" type="number" min="0.001" max="1000000" step="any" value="190"><div class="chips"><button class="chip" data-polyol="190">190 kg</button><button class="chip" data-polyol="95">95 kg</button><button class="chip" data-polyol="142.5">142,5 kg</button></div><label><input type="checkbox" id="polyol-valid"> Poliol cargado</label><label><input type="checkbox" id="iso-valid"> Isocianato cargado</label><label for="product">Producto SAP</label><div class="start-row"><input id="product" placeholder="Ej.: SAP-001" autofocus><button id="start">Iniciar</button></div>
      <p id="start-error" class="error" role="alert"></p><div id="products" class="chips"></div>
      <h3>Formulaciones guardadas</h3><div id="sessions" class="chips"></div>
    </section>
    <section class="card hidden" id="work-card">
      <div class="work-head"><div><p class="eyebrow">FORMULACIÓN</p><h2 id="product-name"></h2><p id="session-id" class="muted"></p></div><span id="status" class="status"></span></div>
      <h3 id="step"></h3><p id="target"></p><div id="signal" class="signal" role="status" aria-live="polite"></div>
      <div class="scale"><span>PESO NETO DEL RECIPIENTE ACTUAL</span><strong id="weight">0</strong><small>kg</small><p id="gross"></p><p id="hardware-live">Lectura HX711: esperando datos…</p></div>
      <div class="simulator"><label for="simulated">Peso de prueba (kg)<input id="simulated" type="number" min="0" max="1000000" step="0.000001" value="0"></label><div class="simulator-actions"><button class="secondary" id="apply-weight">Usar peso de prueba</button><button class="secondary" id="live-weight">Leer balanza</button></div></div>
      <div class="actions"><button class="secondary" id="zero">Tarar recipiente</button><button id="record">OK · Registrar material</button></div>
      <details><summary>Corregir</summary><div class="actions"><button class="secondary" id="reset">Reiniciar actual</button><button class="secondary" id="undo">Repetir último</button></div></details>
      <h3>Fórmula proporcional</h3><div id="recipe"></div>
      <h3>Pesadas registradas</h3><div id="entries" class="entries"></div>
      <div class="finish"><button class="secondary" id="refresh">Actualizar estado</button><button class="secondary" id="finish">Finalizar formulación</button><button class="secondary" id="new">Volver al inicio</button></div>
      <p id="work-error" class="error" role="alert"></p>
    </section>
  </main><script type="module" src="/app.js"></script>
</body></html>
