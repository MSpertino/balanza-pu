[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM3
monitor_filters = send_on_enter
lib_deps = bogde/HX711@^0.7.5
upload_port = COM3
upload_speed = 115200
upload_flags = 
    --before=default_reset
    --after=hard_reset
    --connect-attempts=10